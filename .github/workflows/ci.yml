name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Playwright tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      screenshots-url: ${{ steps.screenshots.outputs.artifact-url }}
      report-url: ${{ steps.report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Upload screenshots
        id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  # Kept apart from the jobs that install and run dependencies, so only this job can write to the pull request.
  comment:
    name: Link screenshots on the pull request
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.e2e.result }}
          SCREENSHOTS_URL: ${{ needs.e2e.outputs.screenshots-url }}
          REPORT_URL: ${{ needs.e2e.outputs.report-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- heal-playwright-screenshots -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { RESULT, SCREENSHOTS_URL, REPORT_URL, HEAD_SHA } = process.env;
            const link = (url, text) => (url ? `[${text}](${url})` : `Not uploaded, see the [workflow run](${runUrl})`);
            const body = [
              marker,
              `## Playwright tests ${RESULT === 'success' ? '✅ passed' : '❌ did not pass'}`,
              '',
              `For commit ${HEAD_SHA.slice(0, 7)}: full-page screenshots of every page in light and dark themes, on desktop Chrome and Pixel 7.`,
              '',
              '| Artifact | Link |',
              '|---|---|',
              `| Screenshots | ${link(SCREENSHOTS_URL, 'Download screenshots')} |`,
              `| Playwright HTML report | ${link(REPORT_URL, 'Download report')} |`,
              '',
              `[View the workflow run](${runUrl})`,
            ].join('\n');

            // Keep one up-to-date comment rather than adding a new one for every push.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
